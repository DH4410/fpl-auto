<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FPL Auto</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f0fdf4;
      --card:      #ffffff;
      --border:    #d1fae5;
      --text:      #064e3b;
      --muted:     #6b7280;
      --primary:   #10b981;
      --primary-d: #059669;
      --danger:    #f43f5e;
      --warn:      #f59e0b;
      --gkp:       #fbbf24;
      --def:       #60a5fa;
      --mid:       #34d399;
      --fwd:       #f87171;
      --shadow:    0 1px 4px rgba(0,0,0,.07);
      --r:         10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Login ─────────────────────────────────────────────── */
    #login {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
    }
    .login-card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(16,185,129,.12);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
    .login-logo {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -1px;
    }
    .login-logo span { color: var(--text); }
    .login-tag {
      font-size: .9rem;
      color: var(--muted);
      margin: .35rem 0 1.75rem;
    }

    .input-group { margin-bottom: .75rem; text-align: left; }
    .input-group label { font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: .3rem; display: block; }
    input[type=email], input[type=password], input[type=text] {
      width: 100%;
      padding: .65rem .9rem;
      border: 1.5px solid #d1fae5;
      border-radius: 8px;
      font-size: .95rem;
      outline: none;
      background: #f9fefb;
      transition: border-color .15s;
    }
    input:focus { border-color: var(--primary); background: #fff; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      width: 100%;
      padding: .7rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-green  { background: var(--primary); color: #fff; }
    .btn-green:hover:not(:disabled)  { background: var(--primary-d); }
    .btn-white  { background: #fff; color: var(--text); border: 1.5px solid var(--border); }
    .btn-white:hover:not(:disabled)  { background: #f9fefb; }
    .btn-red    { background: var(--danger); color: #fff; }
    .btn-red:hover:not(:disabled) { opacity: .88; }
    .btn-sm     { width: auto; padding: .4rem .85rem; font-size: .85rem; }

    .divider {
      display: flex;
      align-items: center;
      gap: .75rem;
      color: var(--muted);
      font-size: .8rem;
      margin: 1rem 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    #login-msg {
      font-size: .85rem;
      margin-top: .85rem;
      min-height: 1.2em;
      padding: .5rem .75rem;
      border-radius: 7px;
      display: none;
    }
    #login-msg.error { background: #fff1f2; color: var(--danger); display: block; }
    #login-msg.info  { background: #ecfdf5; color: var(--primary-d); display: block; }

    /* ── App shell ─────────────────────────────────────────── */
    #app { display: none; }

    header {
      background: #fff;
      border-bottom: 1.5px solid var(--border);
      padding: 0 1.25rem;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .logo { font-size: 1.1rem; font-weight: 800; color: var(--primary); letter-spacing: -.3px; }
    .logo span { color: var(--text); }
    .header-right {
      display: flex;
      align-items: center;
      gap: .75rem;
      font-size: .82rem;
    }
    .stat-chip {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: .2rem .65rem;
      font-weight: 600;
      color: var(--text);
    }
    #user-chip {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: var(--primary-d);
    }

    /* ── Tabs ──────────────────────────────────────────────── */
    .tab-nav {
      display: flex;
      gap: 2px;
      padding: .6rem 1rem .2rem;
      background: #fff;
      border-bottom: 1.5px solid var(--border);
    }
    .tab-btn {
      background: none;
      border: none;
      padding: .45rem 1rem;
      font-size: .9rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: 6px 6px 0 0;
      position: relative;
      transition: color .15s;
    }
    .tab-btn.active { color: var(--primary); }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -3px;
      left: 0; right: 0;
      height: 2.5px;
      background: var(--primary);
      border-radius: 2px 2px 0 0;
    }

    main { max-width: 900px; margin: 0 auto; padding: 1rem; }

    /* ── Info bar ──────────────────────────────────────────── */
    .info-bar {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .info-chip {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: .25rem .8rem;
      font-size: .82rem;
      font-weight: 600;
    }
    .info-chip .label { color: var(--muted); font-weight: 400; }

    /* ── Squad ─────────────────────────────────────────────── */
    .pos-section { margin-bottom: .85rem; }
    .pos-section-title {
      font-size: .72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      margin-bottom: .45rem;
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .pos-dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-GKP { background: var(--gkp); }
    .dot-DEF { background: var(--def); }
    .dot-MID { background: var(--mid); }
    .dot-FWD { background: var(--fwd); }

    .player-row-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: .5rem;
    }

    .player-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-left: 4px solid var(--border);
      border-radius: var(--r);
      padding: .6rem .75rem .6rem .65rem;
      cursor: pointer;
      position: relative;
      transition: border-color .15s, box-shadow .15s;
      user-select: none;
    }
    .player-card:hover       { box-shadow: var(--shadow); border-color: var(--primary); }
    .player-card.transfering { border-color: var(--primary); background: #ecfdf5; }
    .player-card.benched     { opacity: .65; }
    .player-card.pos-GKP     { border-left-color: var(--gkp); }
    .player-card.pos-DEF     { border-left-color: var(--def); }
    .player-card.pos-MID     { border-left-color: var(--mid); }
    .player-card.pos-FWD     { border-left-color: var(--fwd); }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: .3rem; }
    .card-name { font-size: .9rem; font-weight: 700; line-height: 1.2; }
    .card-meta { font-size: .75rem; color: var(--muted); margin-top: .2rem; }
    .card-price { font-weight: 700; color: var(--primary-d); }

    .cap-btn {
      flex-shrink: 0;
      width: 22px; height: 22px;
      border-radius: 50%;
      border: none;
      font-size: .68rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3f4f6;
      color: var(--muted);
      transition: background .15s, color .15s;
    }
    .cap-btn.is-cap { background: var(--warn); color: #fff; }
    .cap-btn.is-vc  { background: #c4b5fd; color: #4c1d95; }

    .bench-divider {
      text-align: center;
      font-size: .75rem;
      font-weight: 600;
      color: var(--muted);
      margin: .6rem 0 .45rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .bench-divider::before, .bench-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* ── Transfer sheet (slides up from bottom) ────────────── */
    #sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.25);
      z-index: 98;
    }
    #transfer-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -6px 30px rgba(0,0,0,.12);
      padding: 0 1rem 1.5rem;
      max-height: 72vh;
      overflow-y: auto;
      z-index: 99;
      transform: translateY(100%);
      transition: transform .28s cubic-bezier(.4,0,.2,1);
    }
    #transfer-sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 38px; height: 4px;
      background: #e5e7eb;
      border-radius: 2px;
      margin: .75rem auto .6rem;
    }
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .85rem;
    }
    .sheet-title { font-size: 1rem; font-weight: 700; }
    .sheet-title .name { color: var(--primary-d); }
    .close-btn {
      background: #f3f4f6;
      border: none;
      width: 28px; height: 28px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
    }
    .close-btn:hover { background: #e5e7eb; }

    .search-row { display: flex; gap: .4rem; margin-bottom: .6rem; }
    .search-row input { flex: 1; }
    .search-row select {
      padding: .5rem .45rem;
      border: 1.5px solid #d1fae5;
      border-radius: 8px;
      font-size: .85rem;
      background: #f9fefb;
      color: var(--text);
    }

    .player-list { max-height: 220px; overflow-y: auto; }
    .pl-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .5rem .4rem;
      border-radius: 7px;
      cursor: pointer;
      transition: background .1s;
    }
    .pl-row:hover    { background: #f0fdf4; }
    .pl-row.selected { background: #d1fae5; }
    .pl-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .pl-dot.a { background: var(--primary); }
    .pl-dot.d, .pl-dot.i { background: var(--warn); }
    .pl-dot.u, .pl-dot.s { background: var(--danger); }
    .pl-info  { flex: 1; min-width: 0; }
    .pl-name  { font-size: .88rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-sub   { font-size: .75rem; color: var(--muted); }
    .pl-price { font-size: .85rem; font-weight: 700; color: var(--primary-d); white-space: nowrap; }

    .transfer-summary {
      background: #f0fdf4;
      border-radius: 9px;
      padding: .75rem;
      margin-top: .75rem;
    }
    .ts-row { display: flex; align-items: center; gap: .6rem; font-size: .9rem; margin-bottom: .3rem; }
    .ts-out { color: var(--danger); font-weight: 700; }
    .ts-in  { color: var(--primary-d); font-weight: 700; }
    .ts-arrow { color: var(--muted); }
    .ts-cost { font-size: .82rem; color: var(--muted); }
    .ts-cost.over { color: var(--danger); font-weight: 600; }

    /* ── Setup tab ─────────────────────────────────────────── */
    .setup-intro {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 1rem;
      margin-bottom: 1rem;
      font-size: .88rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .setup-intro strong { color: var(--text); display: block; margin-bottom: .3rem; font-size: .95rem; }
    .setup-intro a { color: var(--primary-d); }

    .budget-tracker {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1rem;
    }
    .budget-chip {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: .3rem .85rem;
      font-size: .82rem;
      font-weight: 600;
    }
    .budget-chip .val { color: var(--primary-d); }
    .budget-chip .val.over { color: var(--danger); }

    .pos-counter {
      display: flex;
      gap: .35rem;
      flex-wrap: wrap;
      margin-bottom: .85rem;
    }
    .pos-pill {
      padding: .2rem .55rem;
      border-radius: 12px;
      font-size: .75rem;
      font-weight: 700;
    }
    .pos-pill.GKP { background: #fef9c3; color: #92400e; }
    .pos-pill.DEF { background: #dbeafe; color: #1e40af; }
    .pos-pill.MID { background: #d1fae5; color: #065f46; }
    .pos-pill.FWD { background: #fee2e2; color: #991b1b; }

    .setup-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .85rem;
    }
    @media (max-width: 580px) { .setup-cols { grid-template-columns: 1fr; } }

    .setup-panel {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: .85rem;
    }
    .setup-panel h3 { font-size: .9rem; font-weight: 700; margin-bottom: .65rem; }

    .picked-item {
      display: flex;
      align-items: center;
      gap: .45rem;
      padding: .45rem .4rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      margin-bottom: .35rem;
      background: #fff;
    }
    .picked-item .pl-info { flex: 1; }
    .remove-btn {
      background: none;
      border: none;
      color: var(--danger);
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      padding: 0 .2rem;
    }

    /* ── Toast ─────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #064e3b;
      color: #fff;
      padding: .65rem 1.2rem;
      border-radius: 24px;
      font-size: .88rem;
      font-weight: 600;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      z-index: 200;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.ok  { background: var(--primary-d); }
    #toast.err { background: var(--danger); }

    /* ── Spinner ───────────────────────────────────────────── */
    .spin {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .55s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty { text-align: center; color: var(--muted); font-size: .88rem; padding: 1.5rem 0; }

    /* ── Pitch layout ──────────────────────────────────────────────── */
    .pitch-wrap {
      border-radius: 12px;
      overflow: hidden;
      background: repeating-linear-gradient(
        180deg,
        #1d7a3e 0px, #1d7a3e 44px,
        #1a7039 44px, #1a7039 88px
      );
      padding: 12px 8px 10px;
      margin-bottom: .6rem;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.1);
    }
    .pitch-row {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 5px;
      margin-bottom: 6px;
    }
    .p-card {
      background: rgba(255,255,255,.93);
      border-radius: 7px;
      padding: 5px 6px 6px;
      min-width: 68px;
      max-width: 110px;
      flex: 1;
      text-align: center;
      cursor: pointer;
      border-top: 3px solid var(--border);
      transition: transform .12s, box-shadow .12s;
      user-select: none;
      position: relative;
    }
    .p-card:hover       { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.18); }
    .p-card.p-GKP       { border-top-color: var(--gkp); }
    .p-card.p-DEF       { border-top-color: var(--def); }
    .p-card.p-MID       { border-top-color: var(--mid); }
    .p-card.p-FWD       { border-top-color: var(--fwd); }
    .p-card.transferring { box-shadow: 0 0 0 2.5px var(--primary); background: #ecfdf5; }
    .p-card.benched     { opacity: .75; }

    .p-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
    .p-badge { width: 20px; height: 20px; object-fit: contain; flex-shrink: 0; }
    .p-name  { font-size: .72rem; font-weight: 700; color: #064e3b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .p-meta  { font-size: .63rem; color: var(--primary-d); font-weight: 600; }

    .bench-wrap {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 6px;
      margin-bottom: .75rem;
    }
    .bench-title {
      font-size: .72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .07em; color: var(--muted); text-align: center; margin-bottom: 6px;
    }

    /* ── Season Info tab ───────────────────────────────────────────── */
    .season-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: .6rem;
      margin-bottom: 1rem;
    }
    .season-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      padding: .85rem .75rem;
      text-align: center;
    }
    .season-card .s-label { font-size: .75rem; color: var(--muted); margin-bottom: .2rem; }
    .season-card .s-val   { font-size: 1.15rem; font-weight: 800; color: var(--text); }

    .chips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: .5rem;
    }
    .chip-card {
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: var(--r);
      padding: .7rem .65rem;
      text-align: center;
    }
    .chip-card.available { border-color: var(--primary); background: #ecfdf5; }
    .chip-card.used      { opacity: .5; }
    .chip-card .ch-name  { font-size: .82rem; font-weight: 700; color: var(--text); }
    .chip-card .ch-status{ font-size: .72rem; color: var(--muted); margin-top: .15rem; }
    .chip-card.available .ch-status { color: var(--primary-d); }
  </style>
</head>
<body>

<!-- ── Login ──────────────────────────────────────────────────── -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">FPL<span> Auto</span></div>
    <p class="login-tag">Never forget your FPL team again.</p>

    <div class="input-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>
    <div class="input-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••"
             onkeydown="if(event.key==='Enter') doEmailLogin()" />
    </div>
    <button class="btn btn-green" id="email-btn" onclick="doEmailLogin()">Sign in</button>

    <div class="divider">or</div>

    <button class="btn btn-white" id="browser-btn" onclick="doBrowserLogin()">
      🌐 Sign in with Google / Apple
    </button>
    <div id="login-msg"></div>
  </div>
</div>

<!-- ── App ────────────────────────────────────────────────────── -->
<div id="app">
  <header>
    <div class="logo">FPL<span> Auto</span></div>
    <div class="header-right">
      <span class="stat-chip" id="bank-chip" style="display:none"></span>
      <span class="stat-chip" id="ft-chip" style="display:none"></span>
      <span class="stat-chip" id="user-chip"></span>
    </div>
  </header>

  <div class="tab-nav">
    <button class="tab-btn active" onclick="switchTab('team')">My Team</button>
    <button class="tab-btn" onclick="switchTab('setup')">Season Info</button>
  </div>

  <main>
    <!-- My Team -->
    <div id="tab-team">
      <div class="info-bar" id="info-bar"></div>
      <div id="squad-grid"><div class="empty">Loading squad…</div></div>
      <div style="margin-top:.75rem; display:flex; gap:.5rem; flex-wrap:wrap;">
        <button class="btn btn-white btn-sm" onclick="refreshTeam()">↻ Refresh</button>
        <button class="btn btn-green btn-sm" id="save-cap-btn" onclick="saveCaptain()" style="display:none">
          Save captain changes
        </button>
      </div>
    </div>

    <!-- Season Info -->
    <div id="tab-setup" style="display:none">
      <div id="season-content"><div class="empty">Loading season info…</div></div>
    </div>
  </main>
</div>

<!-- ── Transfer bottom sheet ──────────────────────────────────── -->
<div id="sheet-overlay" onclick="closeSheet()"></div>
<div id="transfer-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">Replacing: <span class="name" id="replacing-name">—</span></div>
    <button class="close-btn" onclick="closeSheet()">✕</button>
  </div>
  <div class="search-row">
    <input type="text" id="replace-q" placeholder="Search for replacement…" oninput="replaceSearch()" />
    <select id="replace-pos" onchange="replaceSearch()">
      <option value="">All</option>
      <option value="GKP">GKP</option>
      <option value="DEF">DEF</option>
      <option value="MID">MID</option>
      <option value="FWD">FWD</option>
    </select>
  </div>
  <div id="replace-results" class="player-list"><div class="empty">Search above.</div></div>

  <div id="replace-summary" style="display:none">
    <div class="transfer-summary">
      <div class="ts-row">
        <span class="ts-out" id="ts-out">—</span>
        <span class="ts-arrow">→</span>
        <span class="ts-in" id="ts-in">—</span>
      </div>
      <div class="ts-cost" id="ts-cost"></div>
    </div>
    <div style="margin-top:.65rem">
      <button class="btn btn-green" id="confirm-btn" onclick="confirmTransfer()">Confirm Transfer</button>
    </div>
  </div>
</div>

<!-- ── Toast ──────────────────────────────────────────────────── -->
<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────
let allPlayers = [];     // from /api/bootstrap
let squad = null;        // current 15 picks
let sellPick = null;     // pick selected for transfer out
let buyPlayer = null;    // player selected for transfer in
let captainEl = null;    // element id of captain
let vcEl = null;         // element id of vice-captain
let capDirty = false;    // unsaved captain change
let capSaveTimer = null;

// ── Helpers ────────────────────────────────────────────────────
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(() => { t.className = ''; }, 3000);
}

async function api(path, opts = {}) {
  const r = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

function setBtn(id, html, disabled = false) {
  const b = document.getElementById(id);
  if (!b) return;
  b.innerHTML = html;
  b.disabled = disabled;
}

// ── Auth ───────────────────────────────────────────────────────
async function doEmailLogin() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('password').value;
  if (!email || !pass) return;
  setBtn('email-btn', '<span class="spin"></span> Signing in…', true);
  showLoginMsg('', '');
  try {
    const r = await api('/api/login', {
      method: 'POST',
      body: JSON.stringify({ email, password: pass }),
    });
    onLoggedIn(r.name);
  } catch (e) {
    showLoginMsg(e.message, 'error');
    setBtn('email-btn', 'Sign in', false);
  }
}

async function doBrowserLogin() {
  setBtn('browser-btn', '<span class="spin"></span> Opening browser…', true);
  showLoginMsg('A browser window will open — sign in there.', 'info');
  try {
    await api('/api/login/browser', { method: 'POST' });
    pollBrowserLogin();
  } catch (e) {
    showLoginMsg(e.message, 'error');
    setBtn('browser-btn', '🌐 Sign in with Google / Apple', false);
  }
}

let _pollTimer = null;
function pollBrowserLogin() {
  clearTimeout(_pollTimer);
  _pollTimer = setTimeout(async () => {
    try {
      const r = await api('/api/login/browser/poll');
      if (r.status === 'done') {
        onLoggedIn(r.name);
      } else if (r.status === 'error') {
        showLoginMsg(r.error || 'Login failed.', 'error');
        setBtn('browser-btn', '🌐 Sign in with Google / Apple', false);
      } else {
        pollBrowserLogin(); // still pending
      }
    } catch (e) {
      showLoginMsg(e.message, 'error');
      setBtn('browser-btn', '🌐 Sign in with Google / Apple', false);
    }
  }, 1000);
}

function showLoginMsg(msg, type) {
  const el = document.getElementById('login-msg');
  el.textContent = msg;
  el.className = type;
  el.style.display = msg ? '' : 'none';
}

function onLoggedIn(name) {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-chip').textContent = name || 'Signed in';
  init();
}

// ── Init ───────────────────────────────────────────────────────
async function init() {
  await Promise.all([loadAllPlayers(), loadSquad()]);
}

async function refreshTeam() {
  // Re-check status first so the backend picks up a new entry_id if the user
  // just created their team on the FPL website since the last login.
  try { await api('/api/status'); } catch (_) {}
  await loadSquad();
}

async function loadAllPlayers() {
  try {
    allPlayers = await api('/api/bootstrap');
  } catch (e) { /* bootstrap is optional for squad view */ }
}

async function loadSquad() {
  document.getElementById('squad-grid').innerHTML = '<div class="empty">Loading…</div>';
  try {
    squad = await api('/api/team');
    renderSquad();
    updateHeaderInfo();
  } catch (e) {
    if (e.message.includes('No FPL team')) {
      document.getElementById('squad-grid').innerHTML = `
        <div style="background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:1.25rem 1rem;text-align:center;">
          <div style="font-size:1rem;font-weight:700;color:var(--text);margin-bottom:.4rem;">No FPL squad yet for 2026/27</div>
          <p style="font-size:.85rem;color:var(--muted);line-height:1.55;margin-bottom:.85rem;">
            Create your team on
            <a href="https://fantasy.premierleague.com" target="_blank" style="color:var(--primary-d);">fantasy.premierleague.com</a>,
            then come back here to manage it.
          </p>
          <button class="btn btn-green btn-sm" onclick="refreshTeam()">↻ Refresh</button>
        </div>`;
    } else {
      document.getElementById('squad-grid').innerHTML = `<div class="empty">${e.message}</div>`;
    }
  }
}

// ── Squad render ───────────────────────────────────────────────
function updateHeaderInfo() {
  if (!squad) return;
  const bank = (squad.transfers?.bank ?? 0) / 10;
  const isPreseason = squad.is_preseason;
  const ft = isPreseason ? '∞' : (squad.transfers?.limit ?? 1);
  const ftLabel = isPreseason ? 'Unlimited transfers' : `${ft} free transfer${ft !== 1 ? 's' : ''}`;

  document.getElementById('bank-chip').textContent = `£${bank.toFixed(1)}m`;
  document.getElementById('bank-chip').style.display = '';
  document.getElementById('ft-chip').textContent = ftLabel;
  document.getElementById('ft-chip').style.display = '';

  const ei = squad.entry_info || {};
  const chips = squad.chips || [];
  const chipNameMap = { wildcard: 'Wildcard', bboost: 'Bench Boost', '3xc': 'Triple Captain', freehit: 'Free Hit' };
  const playedChipNames = new Set(chips.map(c => c.name));

  const infoBar = document.getElementById('info-bar');
  infoBar.innerHTML = `
    <div class="info-chip"><span class="label">Bank </span>£${bank.toFixed(1)}m</div>
    <div class="info-chip"><span class="label">Transfers </span>${isPreseason ? 'Unlimited (pre-season)' : ft}</div>
    ${ei.rank ? `<div class="info-chip"><span class="label">Rank </span>#${Number(ei.rank).toLocaleString()}</div>` : ''}
    ${ei.team_name ? `<div class="info-chip" title="Your team name">${ei.team_name}</div>` : ''}
  `;

  // Render season info tab
  const seasonCards = [
    { label: 'Team', val: ei.team_name || '—' },
    { label: 'Overall Rank', val: ei.rank ? '#' + Number(ei.rank).toLocaleString() : '—' },
    { label: 'Total Points', val: ei.total_points ?? '—' },
    { label: 'Free Transfers', val: isPreseason ? 'Unlimited' : ft },
    { label: 'Bank', val: `£${bank.toFixed(1)}m` },
  ].map(c => `<div class="season-card"><div class="s-label">${c.label}</div><div class="s-val">${c.val}</div></div>`).join('');

  const chipCards = Object.entries(chipNameMap).map(([key, name]) => {
    const used = playedChipNames.has(key);
    return `<div class="chip-card ${used ? 'used' : 'available'}">
      <div class="ch-name">${name}</div>
      <div class="ch-status">${used ? '✓ Used' : 'Available'}</div>
    </div>`;
  }).join('');

  document.getElementById('season-content').innerHTML = `
    <div class="season-grid">${seasonCards}</div>
    <div style="font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:.6rem;">Chips</div>
    <div class="chips-grid">${chipCards}</div>`;
}

function renderSquad() {
  if (!squad?.picks?.length) {
    document.getElementById('squad-grid').innerHTML = `
      <div style="background:#fff;border:1.5px solid var(--border);border-radius:var(--r);padding:1.25rem 1rem;text-align:center;">
        <div style="font-size:1rem;font-weight:700;color:var(--text);margin-bottom:.4rem;">No FPL squad yet for 2026/27</div>
        <p style="font-size:.85rem;color:var(--muted);line-height:1.55;margin-bottom:.85rem;">
          Create your team on
          <a href="https://fantasy.premierleague.com" target="_blank" style="color:var(--primary-d);">fantasy.premierleague.com</a>,
          then come back here to manage it.
        </p>
        <button class="btn btn-green btn-sm" onclick="refreshTeam()">↻ Refresh</button>
      </div>`;
    return;
  }

  const cap = squad.picks.find(p => p.is_captain);
  const vc  = squad.picks.find(p => p.is_vice_captain);
  if (!capDirty) {
    captainEl = cap?.element ?? null;
    vcEl      = vc?.element ?? null;
  }

  const starters = squad.picks.filter(p => p.position <= 11).sort((a,b) => a.position - b.position);
  const bench    = squad.picks.filter(p => p.position > 11).sort((a,b) => a.position - b.position);

  const gkp = starters.filter(p => p.pos === 'GKP');
  const def = starters.filter(p => p.pos === 'DEF');
  const mid = starters.filter(p => p.pos === 'MID');
  const fwd = starters.filter(p => p.pos === 'FWD');

  const pitchRowHTML = players =>
    `<div class="pitch-row">${players.map(p => pitchCardHTML(p)).join('')}</div>`;

  document.getElementById('squad-grid').innerHTML = `
    <div class="pitch-wrap">
      ${pitchRowHTML(fwd)}
      ${pitchRowHTML(mid)}
      ${pitchRowHTML(def)}
      ${pitchRowHTML(gkp)}
    </div>
    <div class="bench-wrap">
      <div class="bench-title">Bench</div>
      <div class="pitch-row">${bench.map(p => pitchCardHTML(p, true)).join('')}</div>
    </div>`;
}

function pitchCardHTML(p, benched = false) {
  const isCap = p.element === captainEl;
  const isVC  = p.element === vcEl;
  const capLabel = isCap ? 'C' : isVC ? 'V' : '·';
  const capClass = isCap ? 'is-cap' : isVC ? 'is-vc' : '';
  const transferringClass = sellPick?.element === p.element ? ' transferring' : '';
  const benchClass = benched ? ' benched' : '';
  const badge = `https://resources.premierleague.com/premierleague/badges/t${p.team_code}.png`;
  return `
    <div class="p-card p-${p.pos}${transferringClass}${benchClass}" onclick="selectForTransfer(${p.element})">
      <div class="p-top">
        <img src="${badge}" class="p-badge" onerror="this.style.visibility='hidden'" />
        <button class="cap-btn ${capClass}" onclick="cycleCapt(${p.element},event)">${capLabel}</button>
      </div>
      <div class="p-name">${p.web_name || p.name}</div>
      <div class="p-meta">£${(p.price||0).toFixed(1)}m</div>
    </div>`;
}

// ── Captain (inline toggle) ────────────────────────────────────
function cycleCapt(id, event) {
  event.stopPropagation();
  if (captainEl === id) {
    // captain → vc
    captainEl = null;
    vcEl = id;
  } else if (vcEl === id) {
    // vc → neither
    vcEl = null;
  } else if (!captainEl) {
    captainEl = id;
  } else if (!vcEl) {
    vcEl = id;
  } else {
    vcEl = captainEl;
    captainEl = id;
  }
  capDirty = true;
  document.getElementById('save-cap-btn').style.display = '';
  renderSquad();
}

async function saveCaptain() {
  if (!squad?.picks) return;
  setBtn('save-cap-btn', '<span class="spin"></span> Saving…', true);
  const picks = squad.picks.map(p => ({
    element: p.element,
    position: p.position,
    is_captain: p.element === captainEl,
    is_vice_captain: p.element === vcEl,
  }));
  try {
    await api('/api/picks', { method: 'POST', body: JSON.stringify({ picks }) });
    toast('Captain saved!', 'ok');
    capDirty = false;
    document.getElementById('save-cap-btn').style.display = 'none';
    setBtn('save-cap-btn', 'Save captain changes', false);
    await loadSquad();
  } catch (e) {
    toast(e.message, 'err');
    setBtn('save-cap-btn', 'Save captain changes', false);
  }
}

// ── Transfer sheet ─────────────────────────────────────────────
function selectForTransfer(id) {
  if (sellPick?.element === id) { closeSheet(); return; }
  sellPick = squad?.picks.find(p => p.element === id);
  if (!sellPick) return;
  buyPlayer = null;
  document.getElementById('replacing-name').textContent = sellPick.web_name || sellPick.name;
  document.getElementById('replace-pos').value = sellPick.pos || '';
  document.getElementById('replace-q').value = '';
  document.getElementById('replace-results').innerHTML = '<div class="empty">Search above.</div>';
  document.getElementById('replace-summary').style.display = 'none';
  openSheet();
  renderSquad(); // re-render to show highlight
  document.getElementById('replace-q').focus();
}

function openSheet() {
  document.getElementById('transfer-sheet').classList.add('open');
  document.getElementById('sheet-overlay').style.display = '';
}

function closeSheet() {
  document.getElementById('transfer-sheet').classList.remove('open');
  document.getElementById('sheet-overlay').style.display = 'none';
  sellPick = null;
  buyPlayer = null;
  renderSquad();
}

let _replaceTimer = null;
function replaceSearch() {
  clearTimeout(_replaceTimer);
  _replaceTimer = setTimeout(_doReplaceSearch, 250);
}

async function _doReplaceSearch() {
  const q   = document.getElementById('replace-q').value.trim();
  const pos = document.getElementById('replace-pos').value;
  const el  = document.getElementById('replace-results');
  if (!q && !pos) { el.innerHTML = '<div class="empty">Search above.</div>'; return; }
  el.innerHTML = '<div class="empty">Searching…</div>';
  try {
    const params = new URLSearchParams({ q, pos });
    const players = await api('/api/players?' + params);
    const squadIds = new Set(squad?.picks.map(p => p.element) ?? []);
    const list = players.filter(p => !squadIds.has(p.id));
    if (!list.length) { el.innerHTML = '<div class="empty">No players found.</div>'; return; }
    el.innerHTML = list.map(p => `
      <div class="pl-row ${buyPlayer?.id === p.id ? 'selected' : ''}"
           onclick="selectBuy(${p.id})">
        <div class="pl-dot ${p.status}"></div>
        <div class="pl-info">
          <div class="pl-name">${p.web_name || p.name}</div>
          <div class="pl-sub">${p.position} · ${p.team}</div>
        </div>
        <div class="pl-price">£${p.price.toFixed(1)}m</div>
      </div>`).join('');
  } catch (e) {
    el.innerHTML = `<div class="empty">${e.message}</div>`;
  }
}

function selectBuy(id) {
  buyPlayer = allPlayers.find(p => p.id === id);
  document.querySelectorAll('#replace-results .pl-row').forEach(r =>
    r.classList.toggle('selected', +r.getAttribute('onclick').match(/\d+/)[0] === id)
  );
  updateTransferSummary();
}

function updateTransferSummary() {
  const el = document.getElementById('replace-summary');
  if (!sellPick || !buyPlayer) { el.style.display = 'none'; return; }
  el.style.display = '';
  const sellPrice = (sellPick.selling_price ?? 0) / 10;
  const buyPrice  = buyPlayer.price;
  const diff = sellPrice - buyPrice;
  document.getElementById('ts-out').textContent = `${sellPick.web_name || sellPick.name} (£${sellPrice.toFixed(1)}m)`;
  document.getElementById('ts-in').textContent  = `${buyPlayer.web_name || buyPlayer.name} (£${buyPrice.toFixed(1)}m)`;
  const costEl = document.getElementById('ts-cost');
  if (diff >= 0) {
    costEl.className = 'ts-cost';
    costEl.textContent = `+£${diff.toFixed(1)}m profit added to bank`;
  } else {
    costEl.className = 'ts-cost over';
    costEl.textContent = `−£${Math.abs(diff).toFixed(1)}m from bank`;
  }
}

async function confirmTransfer() {
  if (!sellPick || !buyPlayer) return;
  const btn = document.getElementById('confirm-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> Submitting…';
  try {
    await api('/api/transfer', {
      method: 'POST',
      body: JSON.stringify({ element_out: sellPick.element, element_in: buyPlayer.id }),
    });
    btn.innerHTML = '✓ Transfer complete!';
    btn.style.background = '#059669';
    toast(`✓ ${buyPlayer.web_name || buyPlayer.name} is in your squad!`, 'ok');
    setTimeout(async () => {
      closeSheet();
      await loadSquad();
    }, 1200);
  } catch (e) {
    toast(e.message, 'err');
    btn.disabled = false;
    btn.innerHTML = 'Confirm Transfer';
    btn.style.background = '';
  }
}

// ── Tab switch ─────────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) =>
    b.classList.toggle('active', ['team', 'setup'][i] === name));
  document.getElementById('tab-team').style.display  = name === 'team'  ? '' : 'none';
  document.getElementById('tab-setup').style.display = name === 'setup' ? '' : 'none';
}

// ── Auto-restore session ───────────────────────────────────────
(async () => {
  try {
    const s = await api('/api/status');
    if (s.logged_in) {
      onLoggedIn(s.name);
    }
  } catch (_) {}
})();
</script>
</body>
</html>

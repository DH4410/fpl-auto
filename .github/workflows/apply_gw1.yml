name: Apply GW1 Initial Squad

# Run this ONCE before GW1 deadline to set your initial 15-player squad.
# Trigger manually from GitHub → Actions → "Apply GW1 Initial Squad" → Run workflow.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print squad, skip API submission)?'
        type: boolean
        default: true   # default to safe — flip to false when ready to commit

jobs:
  apply-squad:
    runs-on: ubuntu-latest
    # Up to 13 swaps × 7 min gap = ~91 min worst case. 120 min gives headroom
    # without letting a stuck run burn CI minutes for 6 hours (the GitHub default).
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Apply initial GW1 squad
        id: apply_step
        env:
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_EMAIL:         ${{ secrets.FPL_EMAIL }}
          FPL_PASSWORD:      ${{ secrets.FPL_PASSWORD }}
        run: |
          DRY_ARG="--dry-run"
          if [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            DRY_ARG="--auto"
          fi
          python scripts/apply_team.py $DRY_ARG

      - name: Rotate refresh token in GitHub Secrets
        if: steps.apply_step.outputs.new_refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          echo "${{ steps.apply_step.outputs.new_refresh_token }}" | \
            gh secret set FPL_REFRESH_TOKEN --repo ${{ github.repository }}
          echo "Refresh token rotated successfully."

name: Unit tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: pip install requests pandas numpy pulp python-dotenv
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile all production Python
        run: |
          python -m compileall -q bot scripts
          python -m py_compile fpl_api.py fpl_auth.py app.py

      - name: Parse every Actions workflow as YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |path| YAML.load_file(path, aliases: true); puts "workflow_yaml_ok=#{path}" }'

name: Top 100 Pre/Post-Deadline Scout

on:
  schedule:
    # Every 15 minutes. In the final hour before a deadline this freezes the
    # public Overall standings only (manager IDs/ranks, no picks). After lock it
    # fetches those same managers' newly-public teams once.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: fpl-state-writers
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv pandas

      - name: Freeze ranks / inspect newly locked teams
        run: python scripts/weekly_orchestrator_cohort.py --stage top100

      # Safety model:
      # - BEFORE deadline: standings only; competitor picks are never requested.
      # - AFTER deadline: picks are fetched only for the pre-deadline frozen cohort.
      # - No pre-deadline cohort => strategy analysis is skipped rather than using
      #   already-moving live Overall standings.

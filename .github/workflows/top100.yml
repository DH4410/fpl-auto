name: Top 100 Post-Deadline Scout

on:
  schedule:
    # Lightweight check every 15 minutes. Before a deadline it does nothing;
    # after the deadline it snapshots the newly visible locked teams once.
    # Scheduled workflows run from the default branch, so this activates after merge.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: fpl-state-writers
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv pandas

      # The Python scout has a hard deadline guard. It will not request another
      # manager's GW picks before that GW locks, even if this job is dispatched
      # manually. After the first successful post-deadline snapshot, later
      # 15-minute runs reuse the stored teams and make no picks requests.
      - name: Snapshot newly locked elite managers
        run: python scripts/weekly_orchestrator.py --stage top100

      # stage_top100 commits only when a new snapshot is created. The shared
      # concurrency group prevents races with the weekly orchestrator.

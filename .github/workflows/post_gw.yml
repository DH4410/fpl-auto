name: Weekly Orchestrator (analysis, planning, transfers)

on:
  schedule:
    # Every 2 hours. The orchestrator derives its own stage from the FPL
    # calendar and its saved state, and no-ops when there is nothing to do.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force_stage:
        description: 'Force a stage (blank = auto-detect)'
        required: false
        type: choice
        options:
          - ''
          - POST_GW_ANALYSIS
          - MONITORING
          - PRE_DEADLINE_PLAN
          - EXECUTE
          - INTERNATIONAL_BREAK
      dry_run:
        description: 'Dry run only (no writes to FPL)?'
        type: boolean
        default: false

# Runs are serialised so overlapping jobs can never double-submit the same
# transfers. The EXECUTE stage no longer sleeps in CI — it exits immediately
# if the pre-committed target time hasn't been reached yet, and the next
# 2h cron run picks it up. Most runs finish in < 5 min.
#
# All three scheduled workflows commit to the same branch, and their crons
# collide (0 */2 and 0 */6 coincide four times a day), so they share ONE
# concurrency group. Separate groups let them race on git push; a state push
# that loses the race is what allows a repeated write on the next run.
concurrency:
  group: fpl-state-writers
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 30 min is enough for deep research + MILP planning + a few transfers.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy xgboost==3.1.3 lightgbm==4.6.0 pulp scipy scikit-learn==1.8.0 tabulate python-dotenv

      - name: Run weekly orchestrator
        id: orchestrator
        env:
          FPL_REFRESH_TOKEN:   ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_EMAIL:           ${{ secrets.FPL_EMAIL }}
          FPL_PASSWORD:        ${{ secrets.FPL_PASSWORD }}
          FPL_ENTRY_ID:        ${{ secrets.FPL_ENTRY_ID }}
          GMAIL_FROM:          ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          ARGS="--auto"
          if [ -n "${{ github.event.inputs.force_stage }}" ]; then
            ARGS="$ARGS --force-stage ${{ github.event.inputs.force_stage }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/weekly_orchestrator.py $ARGS

      # Non-blocking: if GH_SECRETS_PAT has expired this fails, but password
      # login is the fallback so the bot keeps working. Failing the job here
      # would only produce a red X the user never sees.
      - name: Rotate refresh token in GitHub Secrets
        id: rotate
        if: steps.orchestrator.outputs.new_refresh_token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          echo "${{ steps.orchestrator.outputs.new_refresh_token }}" | \
            gh secret set FPL_REFRESH_TOKEN --repo ${{ github.repository }}
          echo "Refresh token rotated successfully."

      # The user does not read the Actions tab, so anything that fails silently
      # must be emailed. This covers both a dead PAT and the case where the
      # orchestrator process died before its own Python-level alert could fire
      # (OOM, job timeout, import error).
      - name: Email if rotation or the run itself failed
        if: always() && (steps.rotate.outcome == 'failure' || failure())
        env:
          GMAIL_FROM:         ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ROTATE_OUTCOME:     ${{ steps.rotate.outcome }}
          ORCH_OUTCOME:       ${{ steps.orchestrator.outcome }}
          RUN_URL:            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'EOF'
          import os
          from bot import email_alerts
          rot = os.environ.get("ROTATE_OUTCOME", "")
          orch = os.environ.get("ORCH_OUTCOME", "")
          parts = []
          if rot == "failure":
              parts.append(
                  "Refresh-token rotation FAILED (`gh secret set`).\n"
                  "Most likely GH_SECRETS_PAT has expired or lost 'secrets: write'.\n"
                  "Not urgent: password login is the fallback, so transfers continue.\n"
                  "Fix by issuing a new PAT and updating the GH_SECRETS_PAT secret.")
          if orch not in ("success", ""):
              parts.append(
                  f"The orchestrator step ended with status '{orch}'.\n"
                  "If it did not send its own alert it died before it could "
                  "(job timeout, OOM, or an import error).")
          parts.append("Run log: " + os.environ.get("RUN_URL", "n/a"))
          email_alerts.send_alert("Weekly orchestrator needs attention",
                                  "\n\n".join(parts))
          EOF

      # The orchestrator commits its own state after each stage so a crash
      # cannot cause a repeat submission. This is the catch-all for anything
      # still uncommitted (reports, snapshots) after a partial run.
      - name: Commit reports and state
        if: always()
        run: |
          git config user.name  "FPL Auto Bot"
          git config user.email "bot@fplauto.local"
          git add reports/ data/
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "auto: orchestrator run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            # Retry: a lost push race leaves state unpushed, which is what
            # allows the next run to repeat a write it already made.
            for i in 1 2 3; do
              git pull --rebase --autostash || true
              if git push; then
                echo "Pushed on attempt $i"
                exit 0
              fi
              echo "Push attempt $i failed; retrying..."
              sleep $(( (RANDOM % 5) + 3 ))
            done
            echo "::error::Could not push state after 3 attempts"
            exit 1
          }

name: Weekly Orchestrator (analysis, planning, transfers)

on:
  schedule:
    # Every 2 hours. The orchestrator derives its own stage from the FPL
    # calendar and its saved state, and no-ops when there is nothing to do.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      force_stage:
        description: 'Force a stage (blank = auto-detect)'
        required: false
        type: choice
        options:
          - ''
          - POST_GW_ANALYSIS
          - MONITORING
          - PRE_DEADLINE_PLAN
          - EXECUTE
          - INTERNATIONAL_BREAK
      dry_run:
        description: 'Dry run only (no writes to FPL)?'
        type: boolean
        default: false

# Runs are serialised so overlapping jobs can never double-submit the same
# transfers. The EXECUTE stage no longer sleeps in CI — it exits immediately
# if the pre-committed target time hasn't been reached yet, and the next
# 2h cron run picks it up. Most runs finish in < 5 min.
concurrency:
  group: fpl-weekly-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    # 30 min is enough for deep research + MILP planning + a few transfers.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas numpy xgboost lightgbm pulp scipy tabulate python-dotenv

      - name: Run weekly orchestrator
        id: orchestrator
        env:
          FPL_REFRESH_TOKEN:   ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_EMAIL:           ${{ secrets.FPL_EMAIL }}
          FPL_PASSWORD:        ${{ secrets.FPL_PASSWORD }}
          FPL_ENTRY_ID:        ${{ secrets.FPL_ENTRY_ID }}
          GMAIL_FROM:          ${{ secrets.GMAIL_FROM }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          ARGS="--auto"
          if [ -n "${{ github.event.inputs.force_stage }}" ]; then
            ARGS="$ARGS --force-stage ${{ github.event.inputs.force_stage }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/weekly_orchestrator.py $ARGS

      - name: Rotate refresh token in GitHub Secrets
        if: steps.orchestrator.outputs.new_refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          echo "${{ steps.orchestrator.outputs.new_refresh_token }}" | \
            gh secret set FPL_REFRESH_TOKEN --repo ${{ github.repository }}
          echo "Refresh token rotated successfully."

      # The orchestrator commits its own state after each stage so a crash
      # cannot cause a repeat submission. This is the catch-all for anything
      # still uncommitted (reports, snapshots) after a partial run.
      - name: Commit reports and state
        if: always()
        run: |
          git config user.name  "FPL Auto Bot"
          git config user.email "bot@fplauto.local"
          git add reports/ data/
          git diff --cached --quiet && echo "No changes to commit" || {
            git commit -m "auto: orchestrator run $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            git pull --rebase --autostash || true
            git push
          }
